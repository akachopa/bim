services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bim
      POSTGRES_USER: bim
      POSTGRES_PASSWORD: bimsecret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: bim
      MINIO_ROOT_PASSWORD: bimsecret1
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio:/data

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_DATABASE: bim
      DB_USERNAME: bim
      DB_PASSWORD: bimsecret
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      IFC_SERVICE_URL: http://ifc:8001
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend

  ifc:
    build:
      context: ../ifc-service
    ports:
      - "8001:8001"

volumes:
  pgdata:
  minio:
